# Posts one sticky comment per pull request with the CI result and the UI
# screenshots. It runs whenever "CI" or "PR preview" finishes and rebuilds the
# comment from the latest run of each for the PR's head commit.
#
# Runs from the default branch with write access and never executes code from
# the PR: it reads the preview artifact as untrusted data.
name: PR preview comment

on:
  workflow_run:
    workflows: ["CI", "PR preview"]
    types: [completed]

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: pr-preview-comment
  cancel-in-progress: false

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - name: Collect results
        id: collect
        uses: actions/github-script@v8
        with:
          script: |
            const sha = context.payload.workflow_run.head_sha;
            // The open PR whose head is this commit. Works for forks, where
            // workflow_run.pull_requests is empty.
            const pulls = await github.paginate(github.rest.pulls.list, { ...context.repo, state: 'open', per_page: 100 });
            const pr = pulls.find((p) => p.head.sha === sha);
            if (!pr) {
              core.notice(`No open PR has ${sha} as its head (it moved on, or closed); nothing to post.`);
              return;
            }
            const { data } = await github.rest.actions.listWorkflowRunsForRepo({ ...context.repo, head_sha: sha, event: 'pull_request', per_page: 100 });
            const latest = (name) => data.workflow_runs.filter((r) => r.name === name).sort((a, b) => b.id - a.id)[0];
            const ci = latest('CI');
            const preview = latest('PR preview');

            let ciJobs = [];
            if (ci) {
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, { ...context.repo, run_id: ci.id, per_page: 100 });
              ciJobs = jobs.map((j) => ({ name: j.name, status: j.status, conclusion: j.conclusion, url: j.html_url }));
            }
            core.setOutput('pr', String(pr.number));
            core.setOutput('sha', sha);
            core.setOutput('ci', JSON.stringify({ url: ci?.html_url || '', status: ci?.status || 'missing', conclusion: ci?.conclusion || '', jobs: ciJobs }));
            core.setOutput('preview', JSON.stringify({ url: preview?.html_url || '', status: preview?.status || 'missing', conclusion: preview?.conclusion || '' }));
            // The artifact is uploaded even when screenshots fail, so try any finished run.
            core.setOutput('preview_run', preview && preview.status === 'completed' ? String(preview.id) : '');

      - uses: actions/download-artifact@v5
        if: steps.collect.outputs.preview_run != ''
        continue-on-error: true
        with:
          name: pr-preview
          path: preview
          run-id: ${{ steps.collect.outputs.preview_run }}
          github-token: ${{ github.token }}

      - name: Publish screenshots
        if: steps.collect.outputs.preview_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.collect.outputs.pr }}
          SHA: ${{ steps.collect.outputs.sha }}
        run: |
          set -euo pipefail
          [ -d preview/shots ] || { echo "no screenshots in the artifact"; exit 0; }
          dest="pr-$PR/${SHA:0:7}"
          git init -q previews
          cd previews
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3 4 5; do
            if git fetch -q --depth 1 origin pr-previews; then
              git checkout -q -B pr-previews FETCH_HEAD
            else
              git checkout -q --orphan pr-previews
              git rm -rqf . 2>/dev/null || true
              printf 'Screenshots posted on pull requests by the PR preview workflow.\n' > README.md
            fi
            mkdir -p "$dest"
            # Copy only plain PNG names; everything else in the artifact is ignored.
            for f in ../preview/shots/*.png; do
              [ -e "$f" ] || continue
              name=$(basename "$f")
              [[ "$name" =~ ^[a-z0-9-]+\.png$ ]] || continue
              cp "$f" "$dest/$name"
            done
            git add -A
            git diff --cached --quiet && break
            git commit -qm "PR #$PR at ${SHA:0:7}"
            git push -q origin pr-previews && break
            echo "push raced another preview, retrying ($attempt)"
            sleep $((attempt * 2))
          done

      - name: Comment
        if: steps.collect.outputs.pr != ''
        uses: actions/github-script@v8
        env:
          PR: ${{ steps.collect.outputs.pr }}
          SHA: ${{ steps.collect.outputs.sha }}
          CI: ${{ steps.collect.outputs.ci }}
          PREVIEW: ${{ steps.collect.outputs.preview }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- opencontrol-pr-preview -->';
            const pr = Number(process.env.PR);
            const sha = process.env.SHA;
            const ci = JSON.parse(process.env.CI);
            const preview = JSON.parse(process.env.PREVIEW);
            const read = (p) => (fs.existsSync(p) ? fs.readFileSync(p, 'utf8') : '');
            // Untrusted text goes into fenced blocks with backticks removed.
            const fence = (s) => '```\n' + s.replace(/`/g, "'").slice(-4000) + '\n```';
            const mark = (status, conclusion) =>
              status !== 'completed' ? '⏳' : conclusion === 'success' ? '✅' : conclusion === 'skipped' ? '⏭️' : '❌';

            // CI, from the API (trusted).
            const ciDone = ci.status === 'completed';
            const ciOK = ciDone && ci.conclusion === 'success';
            const ciLine = ci.status === 'missing'
              ? 'not started'
              : ci.jobs.length
                ? ci.jobs.map((j) => `${mark(j.status, j.conclusion)} [${j.name}](${j.url})`).join(' · ')
                : `${mark(ci.status, ci.conclusion)} [run](${ci.url})`;

            // Screenshots, from the artifact (untrusted).
            let shots = { shots: [], errors: [] };
            try { shots = JSON.parse(read('preview/shots/shots.json')); } catch {}
            const safe = (f) => typeof f === 'string' && /^[a-z0-9-]+\.png$/.test(f);
            const base = `https://github.com/${context.repo.owner}/${context.repo.repo}/blob/pr-previews/pr-${pr}/${sha.slice(0, 7)}`;
            const img = (f, w) => (safe(f) ? `<a href="${base}/${f}"><img src="${base}/${f}?raw=true" width="${w}"></a>` : '');
            const byPage = new Map();
            for (const s of shots.shots || []) {
              if (!safe(s.file)) continue;
              const key = String(s.page).replace(/[^a-z0-9-]/g, '');
              if (!byPage.has(key)) byPage.set(key, {});
              byPage.get(key)[String(s.variant)] = s.file;
            }
            const errs = (shots.errors || []).map(String);
            const previewDone = preview.status === 'completed';
            const previewOK = byPage.size > 0 && errs.length === 0;

            const head = !ciDone || !previewDone ? '⏳' : ciOK && previewOK ? '✅' : '⚠️';
            const lines = [marker, `## ${head} Preview of ${sha.slice(0, 7)}`, '', `**CI:** ${ciLine}`, ''];

            if (!previewDone) {
              lines.push(`**Screenshots:** ⏳ [in progress](${preview.url})`);
            } else if (byPage.size === 0) {
              lines.push(`**Screenshots:** ❌ none. The server or the screenshot script failed ([run log](${preview.url})).`, '', fence(read('preview/preview.log') || read('preview/server.log') || 'no output'));
            } else {
              lines.push(`**Browser console:** ${errs.length ? `❌ ${errs.length} error(s)` : '✅ no errors'}`);
              if (errs.length) lines.push('', fence(errs.slice(0, 15).join('\n')));
              lines.push('', '<details open><summary>Screenshots</summary>', '');
              lines.push('| Page | Light | Dark | Mobile |', '| --- | --- | --- | --- |');
              for (const [page, v] of byPage) {
                lines.push(`| ${page} | ${img(v.desktop, 260)} | ${img(v.dark, 260)} | ${img(v.mobile, 90)} |`);
              }
              lines.push('', '</details>');
            }
            lines.push('', `<sub>Updated when CI or the preview finishes · [preview run](${preview.url || '#'}) · sample data is seeded fresh on every run</sub>`);
            const body = lines.join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number: pr, per_page: 100 });
            const mine = comments.find((c) => c.user.type === 'Bot' && c.body.includes(marker));
            if (mine) await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: pr, body });
