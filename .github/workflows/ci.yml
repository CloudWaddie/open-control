name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal)" || (gofmt -l cmd internal; exit 1)
      - run: go vet ./...
      - run: go test -race ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      # The committed bundle must match the source, or `go build` ships a stale UI.
      - name: dist is up to date
        run: git diff --exit-code --stat -- internal/web/dist

  docker:
    runs-on: ubuntu-latest
    needs: [go]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t opencontrol:ci .
      - name: smoke test
        run: |
          docker run -d --name oc -p 15353:5353/udp opencontrol:ci
          for i in $(seq 1 20); do docker exec oc /opencontrol healthcheck && break; sleep 1; done
          docker exec oc /opencontrol healthcheck
